# Copy to routing.yaml, edit, commit, then preview and activate it.
version: 1

routes:
  tag:editor:
    model: claude-haiku-4-5
    previous_model: claude-sonnet-4-5
    note: replay eval non-inferior

experiments:
  tag:financial_journalist:
    # Changing an experiment requires a new stable id.
    id: exp:journalist-haiku-v1
    candidate_model: claude-haiku-4-5
    split_pct: 25
    max_calls_per_task: 60

# Descriptive only: validates stable names and routing targets; never schedules.
workflows:
  article-pipeline:
    git:abc123:
      steps:
        research:
          allows: {fan_out: true, retry: true}
        draft:
          predecessors: [research]
          allows: {retry: true}

# Exact-version rules only. Step beats workflow, which beats use-case routing.
# A route to another provider must speak the same API as the use-case, or
# every call of that use-case fails until the route is cleared.
workflow_routes:
  article-pipeline:
    git:abc123:
      model: claude-haiku-4-5
      steps:
        draft:
          model: claude-sonnet-4-5
