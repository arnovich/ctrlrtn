# ctrlrtn model prices — USD per 1,000,000 tokens.
#
# Approximate provider list prices. Edit here to change them, then restart the
# server (prices are read once at startup). Or point CTRLRTN_PRICES at your
# own TOML file to overlay these without editing the package; an override merges
# per field, so setting just `input` keeps a model's other fields.
#
# Models are matched by the longest family prefix ending on a delimiter, so
# version-suffixed ids (claude-sonnet-4-5-20250929) resolve to their family —
# only add a version-specific row when its price differs. A model id containing
# a dot MUST be quoted in the table header: [prices."gpt-3.5-turbo"].
#
# Anthropic prices verified against platform.claude.com/docs pricing, 2026-07.
# max_output = the model's synchronous max output tokens (models overview,
# same date) — a route clamps a larger recorded max_tokens down to this so a
# switch to a smaller-cap model can't 400 the whole use-case.
# Cache figures: 5-minute write (1.25x input) and cache read (0.1x input).
#
# NOTE: Fable 5, Sonnet 5 and Opus >= 4.7 use a newer tokenizer producing ~30%
# MORE tokens for the same text than Sonnet-4.x-era models. A cross-tokenizer
# repricing on recorded token counts (as the campaign report does) under-counts
# the newer model's tokens accordingly.

[prices.claude-fable-5]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.50
max_output = 128000

# Opus 4.5 through 4.8 share one price. claude-opus-4 (below) keeps the retired
# 4.0/4.1-era price, which claude-opus-4-1 correctly prefix-matches.
