name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: router-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra test --extra tui
      - run: uv run black --check src tests
      - run: uv run isort --check-only src tests
      - run: uv run ruff check src tests
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test --extra tui --extra provider-test
      - name: tests with branch coverage and no hidden skips
        run: >-
          uv run pytest -q -m "not stress" --fail-on-skip
          --cov=ctrlrtn --cov-branch --cov-report=term-missing
          --cov-report=xml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra test
      # Packaging tripwire. `uv build` alone only proves the wheel builds --
      # it succeeds whether or not the data file landed inside, and the
      # editable install the tests run against resolves prices.toml from the
      # source tree either way. So assert the wheel's actual contents.
      - run: uv build
      - name: wheel carries its package data and entry point
        run: uv run python scripts/check_wheel.py
      - name: installed wheel starts outside the source environment
        run: uv run --isolated --no-project --with ./dist/*.whl ctrlrtn --version
