name: nightly hardening

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  randomized-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: >-
          uv sync --extra test --extra tui --extra provider-test
          --extra stress
      - name: randomized complete suite
        run: uv run pytest -q -m "not stress" --fail-on-skip
      - name: repeated contention and lifecycle suite
        run: uv run pytest -q -m stress --count=3

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra test --extra mutation
      - run: uv run mutmut run --max-children 4
      - run: uv run python scripts/check_mutation_results.py
