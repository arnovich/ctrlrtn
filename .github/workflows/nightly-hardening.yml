name: nightly hardening

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctrlrtn-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  randomized-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: >-
          uv sync --locked --extra test --extra tui --extra provider-test
          --extra stress
      - name: randomized complete suite
        run: uv run pytest -q -m "not stress" --fail-on-skip
      - name: repeated contention and lifecycle suite
        run: uv run pytest -q -m stress --count=3

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra test --extra mutation
      - run: uv run mutmut run --max-children 4
      - run: uv run python scripts/check_mutation_results.py
